# Monta Publifoto en ordenadores de GitHub: .dmg para Mac con chip Apple (M1 o posterior)
# y para Mac Intel, y la carpeta con Publifoto.exe para Windows.
# Se lanza solo al subir cambios, o a mano en Actions > "Montar Publifoto" > Run workflow.
# Los montajes quedan para descargar en la página del montaje, en "Artifacts".
name: Montar Publifoto

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            nombre: Publifoto-Mac-chip-Apple
          - runner: macos-15-intel
            nombre: Publifoto-Mac-Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # el Python oficial de python.org funciona desde macOS 11; el de setup-python se
      # compila en los Mac de GitHub y podría pedir un macOS más nuevo
      - name: Python 3.12 oficial
        run: |
          curl -sSLo python.pkg https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg
          sudo installer -pkg python.pkg -target /
      - name: Montar
        env:
          PYTHON: /Library/Frameworks/Python.framework/Versions/3.12/bin/python3.12
        run: bash empaquetar/construir_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nombre }}
          path: dist/Publifoto.dmg
          retention-days: 30

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Montar
        shell: cmd
        run: empaquetar\construir_windows.bat
      - uses: actions/upload-artifact@v4
        with:
          name: Publifoto-Windows
          path: dist/Publifoto
          retention-days: 30
