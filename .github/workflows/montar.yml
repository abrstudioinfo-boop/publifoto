# Monta Publifoto en ordenadores de GitHub: .dmg para Mac con chip Apple (M1 o posterior)
# y para Mac Intel, y la carpeta con Publifoto.exe para Windows.
# Se lanza solo al subir cambios, o a mano en Actions > "Montar para Mac" > Run workflow.
# Los montajes quedan para descargar en la página del montaje, en "Artifacts".
name: Montar Publifoto

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            nombre: Publifoto-Mac-chip-Apple
          - runner: macos-15-intel
            nombre: Publifoto-Mac-Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Montar
        env:
          PYTHON: python
        run: bash empaquetar/construir_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nombre }}
          path: dist/Publifoto.dmg
          retention-days: 30

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Montar
        shell: cmd
        run: empaquetar\construir_windows.bat
      - uses: actions/upload-artifact@v4
        with:
          name: Publifoto-Windows
          path: dist/Publifoto
          retention-days: 30
